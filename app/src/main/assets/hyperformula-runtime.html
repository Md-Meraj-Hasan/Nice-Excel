<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body>
<script src="hyperformula.bundle.js"></script>
<script>
(function () {
  'use strict';
  let engine = null;
  let previous = null;
  const addressPattern = /^([A-Z]{1,3})([1-9][0-9]*)$/i;
  const snapshotParts = new Map();

  function addressParts(address) {
    const match = addressPattern.exec(address);
    if (!match) return null;
    let col = 0;
    for (const ch of match[1].toUpperCase()) col = col * 26 + ch.charCodeAt(0) - 64;
    return { row: Number(match[2]) - 1, col: col - 1 };
  }

  function engineValue(value) {
    return typeof value === 'string' && value.trimStart().startsWith('=')
      ? window.NiceExcelFormulaCompat.normalizeFormula(value) : value;
  }

  function toSheets(snapshot) {
    const output = {};
    for (const [sheetName, cells] of Object.entries(snapshot)) {
      let maxRow = -1, maxCol = -1;
      for (const address of Object.keys(cells || {})) {
        const point = addressParts(address);
        if (!point) continue;
        maxRow = Math.max(maxRow, point.row);
        maxCol = Math.max(maxCol, point.col);
      }
      const rows = Array.from({ length: maxRow + 1 }, () => Array(maxCol + 1).fill(null));
      for (const [address, raw] of Object.entries(cells || {})) {
        const point = addressParts(address);
        if (!point) continue;
        rows[point.row][point.col] = raw === '' || raw === undefined ? null : engineValue(raw);
      }
      output[sheetName] = rows;
    }
    return output;
  }

  function rebuild(snapshot) {
    if (engine) {
      try { engine.destroy(); } catch (_) {}
    }
    engine = HyperFormula.buildFromSheets(toSheets(snapshot), { licenseKey: 'gpl-v3' });
    previous = JSON.parse(JSON.stringify(snapshot));
  }

  function applyChanges(snapshot) {
    const oldNames = Object.keys(previous || {});
    const newNames = Object.keys(snapshot || {});
    if (!engine || oldNames.length !== newNames.length || oldNames.some((name, i) => name !== newNames[i])) {
      rebuild(snapshot);
      return;
    }
    const updates = [];
    for (const sheetName of newNames) {
      const before = previous[sheetName] || {};
      const after = snapshot[sheetName] || {};
      const addresses = new Set([...Object.keys(before), ...Object.keys(after)]);
      const sheetId = engine.getSheetId(sheetName);
      if (sheetId === undefined) {
        rebuild(snapshot);
        return;
      }
      for (const address of addresses) {
        const oldValue = Object.prototype.hasOwnProperty.call(before, address) ? before[address] : null;
        const newValue = Object.prototype.hasOwnProperty.call(after, address) ? after[address] : null;
        if (oldValue === newValue) continue;
        const point = addressParts(address);
        if (!point) continue;
        updates.push({ sheet: sheetId, row: point.row, col: point.col, value: newValue === '' ? null : engineValue(newValue) });
      }
    }
    if (updates.length) {
      engine.batch(() => {
        for (const item of updates) {
          engine.setCellContents({ sheet: item.sheet, row: item.row, col: item.col }, [[item.value]]);
        }
      });
    }
    previous = JSON.parse(JSON.stringify(snapshot));
  }

  function normalize(value, numericKeys, key) {
    if (value === null || value === undefined) return '';
    if (Array.isArray(value)) {
      const first = value.length ? (Array.isArray(value[0]) ? value[0][0] : value[0]) : null;
      return normalize(first, numericKeys, key);
    }
    if (typeof value === 'object') {
      if (Object.prototype.hasOwnProperty.call(value, 'value')) return String(value.value);
      return JSON.stringify(value);
    }
    if (typeof value === 'number') {
      if (!Number.isFinite(value)) return '#NUM!';
      numericKeys.push(key);
    }
    return String(value);
  }

  window.NiceExcelHF = {
    beginSnapshot(id, count) {
      snapshotParts.set(id, new Array(count));
      return true;
    },
    appendSnapshotChunk(id, index, chunk) {
      const parts = snapshotParts.get(id);
      if (!parts || index < 0 || index >= parts.length) throw new Error('Snapshot transfer is not initialized');
      parts[index] = chunk;
      return true;
    },
    calculateSnapshot(id, activeSheet, visibleRows, visibleCols) {
      const parts = snapshotParts.get(id);
      snapshotParts.delete(id);
      if (!parts || parts.some(part => typeof part !== 'string')) {
        return JSON.stringify({ error: 'Workbook snapshot transfer is incomplete' });
      }
      const binary = atob(parts.join(''));
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      const snapshotJson = new TextDecoder('utf-8').decode(bytes);
      return this.calculate(snapshotJson, activeSheet, visibleRows, visibleCols);
    },
    version: HyperFormula.version || '3.5.0',
    calculate(snapshotJson, activeSheet, visibleRows, visibleCols) {
      try {
        const snapshot = JSON.parse(snapshotJson);
        applyChanges(snapshot);
        const results = {};
        const numericKeys = [];
        const spillValues = {};
        for (const [sheetName, cells] of Object.entries(snapshot)) {
          const sheetId = engine.getSheetId(sheetName);
          for (const [address, raw] of Object.entries(cells || {})) {
            if (typeof raw !== 'string' || !raw.trimStart().startsWith('=')) continue;
            const point = addressParts(address);
            if (!point) continue;
            const key = sheetName + '!' + address.toUpperCase();
            results[key] = normalize(engine.getCellValue({ sheet: sheetId, row: point.row, col: point.col }), numericKeys, key);
          }
        }
        const activeCells = snapshot[activeSheet] || {};
        const hasArrayFormula = Object.values(activeCells).some(raw =>
          typeof raw === 'string' && /^=\s*(FILTER|SORT|UNIQUE|SEQUENCE|TRANSPOSE|HSTACK|VSTACK|ARRAYFORMULA)\s*\(/i.test(raw)
        );
        const activeSheetId = engine.getSheetId(activeSheet);
        if (hasArrayFormula && activeSheetId !== undefined) {
          const rows = Math.max(1, Math.min(Number(visibleRows) || 50, 1000));
          const cols = Math.max(1, Math.min(Number(visibleCols) || 26, 26));
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const address = (function columnName(index) {
                let n = index + 1, out = '';
                while (n > 0) { const r = (n - 1) % 26; out = String.fromCharCode(65 + r) + out; n = Math.floor((n - 1) / 26); }
                return out;
              })(col) + String(row + 1);
              if (Object.prototype.hasOwnProperty.call(activeCells, address) && activeCells[address] !== null && activeCells[address] !== '') continue;
              const value = engine.getCellValue({ sheet: activeSheetId, row, col });
              if (value !== null && value !== undefined) {
                const key = activeSheet + '!' + address;
                spillValues[key] = normalize(value, [], key);
              }
            }
          }
        }
        return JSON.stringify({ version: this.version, results, numericKeys, spillValues });
      } catch (error) {
        return JSON.stringify({ error: String(error && error.message || error) });
      }
    }
  };
})();
</script>
</body>
</html>
