
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    // Native libraries from the matching LibreOffice Android core build.
    // The directory is empty until genuine LO outputs are supplied.
    sourceSets {
        main {
            jniLibs.srcDirs = ["${rootProject.projectDir}/native-engine/jniLibs"]
        }
    }
    // LibreOffice Android native outputs are supplied separately after a genuine
    // LibreOffice core build. Keep the path stable for Gradle and CI validation.
    sourceSets {
        main {
            jniLibs.srcDirs = ["${rootProject.projectDir}/native-engine/jniLibs"]
        }
    }
    namespace 'com.meraj.niceexcel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.meraj.niceexcel'
        minSdk 26
        targetSdk 35

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        versionCode 17
        versionName '1.6.1'

        // Chaquopy: supported CPU architectures
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Apache POI formula and spreadsheet support
    implementation 'org.apache.poi:poi:5.4.1'

    // Unit tests
    testImplementation 'junit:junit:4.13.2'

    // Android instrumentation tests
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

// Bundle Python + Flask for the optional offline Web Excel screen.
chaquopy {
    defaultConfig {
        version = "3.11"

        pip {
            install "pydantic==1.10.21"
            install "flask==3.0.3"
            install "openpyxl==3.1.5"
            install "python-multipart==0.0.20"
        }
    }
}



// This task verifies packaging prerequisites only. It does not build LibreOffice.
tasks.register("verifyLibreOfficeArm64Core") {
    group = "verification"
    description = "Verify a genuine LibreOffice Android ARM64 core is present for APK packaging."
    doLast {
        def core = file("${rootProject.projectDir}/native-engine/jniLibs/arm64-v8a/liblo-native-code.so")
        if (!core.isFile() || core.length() < 1_000_000L) {
            throw new GradleException("Missing genuine LibreOffice ARM64 core: ${core}. Build LibreOffice Android core separately and copy its real output here.")
        }
        logger.lifecycle("LibreOffice ARM64 core file found (${core.length()} bytes). ELF architecture and APK inclusion are checked by native-engine/scripts.")
    }
}


