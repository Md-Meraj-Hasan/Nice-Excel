plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.meraj.niceexcel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.meraj.niceexcel'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 18
        versionName '1.7.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // Guarded fallback when the isolated HyperFormula runtime is unavailable.
    implementation 'org.apache.poi:poi:5.4.1'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install "pydantic==1.10.21"
            install "flask==3.0.3"
            install "openpyxl==3.1.5"
            install "python-multipart==0.0.20"
        }
    }
}

// The generated bundle is packaged in the APK; no CDN or runtime download is used.
tasks.register("verifyHyperFormulaBundle") {
    group = "verification"
    description = "Verify the locally bundled HyperFormula GPLv3 runtime is present."
    doLast {
        def bundle = file("${projectDir}/src/main/assets/hyperformula.bundle.js")
        if (!bundle.isFile() || bundle.length() < 100_000L) {
            throw new GradleException("Missing HyperFormula bundle: ${bundle}. Run 'npm install' and 'npm run build:hyperformula' before building the APK.")
        }
        logger.lifecycle("Offline HyperFormula bundle verified (${bundle.length()} bytes).")
    }
}

tasks.named("preBuild").configure { dependsOn("verifyHyperFormulaBundle") }
