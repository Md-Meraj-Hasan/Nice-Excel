name: Build NiceExcel APK (LibreOffice status reported honestly)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download matching LibreOffice ARM64 native core
        uses: actions/download-artifact@v4
        with:
          name: libreoffice-arm64-native-core
          repository: ${{ github.repository }}
          run-id: 41280547094
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/libreoffice-core
      - name: Download matching LibreOffice runtime assets
        uses: actions/download-artifact@v4
        with:
          name: libreoffice-arm64-runtime-assets
          repository: ${{ github.repository }}
          run-id: 41280547094
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/libreoffice-runtime
      - name: Stage matching LibreOffice runtime and native libraries
        shell: bash
        run: |
          set -euo pipefail
          ROOT=app/src/main/assets
          mkdir -p "$ROOT" native-engine/jniLibs/arm64-v8a
          test -s /tmp/libreoffice-runtime/assets/program/fundamentalrc
          test -s /tmp/libreoffice-runtime/assets/unpack/program/sofficerc
          cp -a /tmp/libreoffice-runtime/assets/. "$ROOT/"
          cp -a /tmp/libreoffice-runtime/assets_strippedUI/. "$ROOT/"
          FONT_CONF="$ROOT/unpack/etc/fonts/fonts.conf"
          test -s "$FONT_CONF"
          sed -i -E 's#/data/data/[^/]+/fontconfig#/data/data/com.meraj.niceexcel/fontconfig#g' "$FONT_CONF"
          grep -q '/data/data/com.meraj.niceexcel/fontconfig' "$FONT_CONF"
          mapfile -t libs < <(find /tmp/libreoffice-core -type f -name '*.so' -print)
          test "${#libs[@]}" -eq 14
          for lib in "${libs[@]}"; do cp -v "$lib" native-engine/jniLibs/arm64-v8a/; done
          test -s native-engine/jniLibs/arm64-v8a/liblo-native-code.so
          test "$(find native-engine/jniLibs/arm64-v8a -maxdepth 1 -name '*.so' | wc -l)" -eq 14
          echo "Staged 14 ARM64 native libraries and $(find "$ROOT" -type f | wc -l) runtime files"
      - name: Verify LibreOffice ARM64 architecture and dependencies
        run: |
          bash native-engine/scripts/check-arm64-core.sh
          bash native-engine/scripts/check-native-dependency-closure.sh
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Report LibreOffice native core availability
        shell: bash
        run: |
          if [[ -s native-engine/jniLibs/arm64-v8a/liblo-native-code.so ]]; then
            echo "LibreOffice core file is present. Full ELF and APK checks run in Verify LibreOffice APK workflow."
          else
            echo "NOTICE: LibreOffice native core is NOT present. This APK will NOT have LibreOffice Calc linked."
          fi
      - name: Run Android unit tests and verify LibreOffice runtime
        run: |
          gradle --no-daemon testDebugUnitTest
          gradle --no-daemon :app:verifyLibreOfficeArm64Core
          gradle --no-daemon :app:verifyLibreOfficeRuntimeAssets
      - name: Install LibreOffice formula test engine
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc python3-openpyxl
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Diagnose formula engines and calculation results
        run: |
          python3 scripts/formula_engine_diagnostics.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --report build/reports/formula-engine-diagnostics.json \
            --require-android-native-core
      - name: Upload formula engine diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: NiceExcel-formula-engine-diagnostics
          path: build/reports/formula-engine-diagnostics.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK (native status depends on supplied core)
        uses: actions/upload-artifact@v4
        with:
          name: NiceExcel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
