name: Build NiceExcel APK (HyperFormula GPLv3)

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'feature/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js for offline HyperFormula bundle
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Run HyperFormula GPLv3 formula tests
        run: npm run test:hyperformula
      - name: Bundle HyperFormula into Android assets
        run: npm run build:hyperformula
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify offline HyperFormula bundle
        run: gradle --no-daemon verifyHyperFormulaBundle
      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Compile on-device HyperFormula smoke test
        run: gradle --no-daemon assembleDebugAndroidTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NiceExcel-HyperFormula-GPLv3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
