name: Build NiceExcel APK with offline HyperFormula

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'hyperformula/gplv3-integration']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js for the offline formula engine
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify bundled HyperFormula runtime
        run: |
          npm install --no-audit --no-fund
          npm run build:hyperformula
          npm run test:hyperformula
          test -s app/src/main/assets/hyperformula.bundle.js
          test -s backend/niceexcel_api/static/hyperformula.bundle.js
          test -s app/src/main/assets/THIRD_PARTY_LICENSES/HyperFormula-GPL-3.0.txt
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK with offline HyperFormula
        uses: actions/upload-artifact@v4
        with:
          name: NiceExcel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
