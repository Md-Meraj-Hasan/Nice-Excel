name: Build NiceExcel APK (LibreOffice status reported honestly)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Detect LibreOffice native core
        id: libreoffice
        shell: bash
        run: |
          if [[ -s native-engine/jniLibs/arm64-v8a/liblo-native-code.so ]]; then
            echo "status=with-libreoffice" >> "$GITHUB_OUTPUT"
            echo "::notice::LibreOffice native core is present. The APK will include the staged Calc native library."
          else
            echo "status=without-libreoffice" >> "$GITHUB_OUTPUT"
            echo "::warning::This is a fallback-only APK. LibreOffice Calc is NOT linked; do not use this artifact to test full Excel formula support. Use the 'Build NiceExcel APK with LibreOffice ARM64' workflow artifact instead."
          fi
      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify LibreOffice APK when native core is present
        if: steps.libreoffice.outputs.status == 'with-libreoffice'
        run: bash native-engine/scripts/check-apk-libreoffice.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK without LibreOffice (fallback only)
        if: steps.libreoffice.outputs.status == 'without-libreoffice'
        uses: actions/upload-artifact@v4
        with:
          name: NiceExcel-debug-apk-NO-LibreOffice-fallback-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK with LibreOffice ARM64
        if: steps.libreoffice.outputs.status == 'with-libreoffice'
        uses: actions/upload-artifact@v4
        with:
          name: NiceExcel-debug-apk-LibreOffice-ARM64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
