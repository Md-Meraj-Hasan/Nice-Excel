name: Build NiceExcel APK (LibreOffice status reported honestly)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Report LibreOffice native core availability
        shell: bash
        run: |
          if [[ -s native-engine/jniLibs/arm64-v8a/liblo-native-code.so ]]; then
            echo "LibreOffice core file is present. Full ELF and APK checks run in Verify LibreOffice APK workflow."
          else
            echo "NOTICE: LibreOffice native core is NOT present. This APK will NOT have LibreOffice Calc linked."
          fi
      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK (native status depends on supplied core)
        uses: actions/upload-artifact@v4
        with:
          name: NiceExcel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
