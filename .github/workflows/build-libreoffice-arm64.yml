name: Build official LibreOffice Android ARM64 core

on:
  push:
    paths:
      - '.github/workflows/build-libreoffice-arm64.yml'
  workflow_dispatch:
    inputs:
      libreoffice_ref:
        description: LibreOffice core branch, tag, or commit to build
        required: true
        default: 6e0b39149b549bd05065d451006c4d060589891d
        type: string
      build_jobs:
        description: Parallel build jobs (keep low on hosted runners)
        required: true
        default: '2'
        type: string

permissions:
  contents: read

concurrency:
  group: libreoffice-arm64-native-build
  cancel-in-progress: false

jobs:
  build-native-core:
    # LibreOffice native compilation is memory/disk intensive. This workflow is
    # deliberately manual and separate from the fast NiceExcel APK workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LO_BUILD_JOBS: ${{ inputs.build_jobs || '2' }}
    steps:
      - name: Checkout NiceExcel
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and LibreOffice toolchain
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-30 build-tools;30.0.3 ndk;27.2.12479018'

      - name: Resolve Android NDK path
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Install LibreOffice build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          elif [[ -f /etc/apt/sources.list ]]; then
            sudo sed -i '/^# deb-src /s/^# //' /etc/apt/sources.list
          fi
          sudo apt-get update
          sudo apt-get build-dep -y libreoffice
          sudo apt-get install -y build-essential git ccache pkg-config python3 python3-dev python3-venv \
            bison flex gperf nasm yasm zip unzip wget curl autoconf automake libtool

      - name: Checkout official LibreOffice core source
        uses: actions/checkout@v4
        with:
          repository: LibreOffice/core
          ref: ${{ inputs.libreoffice_ref || '6e0b39149b549bd05065d451006c4d060589891d' }}
          path: libreoffice-core
          fetch-depth: 1

      - name: Record build environment
        shell: bash
        run: |
          java -version
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          git -C libreoffice-core rev-parse HEAD
          df -h
          free -h

      - name: Build and stage genuine ARM64 LibreOffice core
        shell: bash
        run: bash native-engine/scripts/build-libreoffice-android-arm64.sh "$GITHUB_WORKSPACE/libreoffice-core"

      - name: Verify ARM64 core and dependency closure
        shell: bash
        run: |
          bash native-engine/scripts/check-arm64-core.sh
          bash native-engine/scripts/check-native-dependency-closure.sh

      - name: Verify generated LibreOffice runtime assets
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/assets/program/fundamentalrc
          test -s android/app/assets/program/bootstraprc
          test -s android/app/assets/program/unorc
          test -s android/app/assets/unpack/program/sofficerc
          test -s android/app/assets_strippedUI/share/registry/main.xcd
          test -s android/app/assets_strippedUI/share/registry/res/registry_en-US.xcd
          files=$(find android/app/assets android/app/assets_strippedUI -type f | wc -l)
          echo "LibreOffice runtime asset files: $files"
          test "$files" -gt 20

      - name: Upload LibreOffice runtime assets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libreoffice-arm64-runtime-assets
          path: |
            android/app/assets/**
            android/app/assets_strippedUI/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload native build logs and manifest even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libreoffice-arm64-build-diagnostics
          path: |
            native-engine/ARM64-BUILD-MANIFEST.txt
            native-engine/ARM64-CORE-DISCOVERY.txt
            native-engine/ARM64-ABI-PREFLIGHT-FAILED.txt
            native-engine/LIBREOFFICE-SOURCE-COMMIT.txt
            libreoffice-core/config.log
            libreoffice-core/autogen.input
          if-no-files-found: warn
          retention-days: 14

      - name: Upload genuine ARM64 native core
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libreoffice-arm64-native-core
          path: native-engine/jniLibs/arm64-v8a/*.so
          if-no-files-found: error
          retention-days: 14
