
name: Build NiceExcel APK with LibreOffice ARM64

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: "Successful LibreOffice native-core workflow Run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download LibreOffice ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: libreoffice-arm64-native-core
          repository: ${{ github.repository }}
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/libreoffice-core

      - name: Stage native libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-engine/jniLibs/arm64-v8a
          cp -v /tmp/libreoffice-core/*.so \
            native-engine/jniLibs/arm64-v8a/
          test -s native-engine/jniLibs/arm64-v8a/liblo-native-code.so
          count=$(find native-engine/jniLibs/arm64-v8a \
            -maxdepth 1 -name '*.so' | wc -l)
          echo "Native libraries found: $count"
          test "$count" -eq 14

      - name: Verify ARM64 architecture
        run: bash native-engine/scripts/check-arm64-core.sh

      - name: Verify native dependencies
        run: bash native-engine/scripts/check-native-dependency-closure.sh

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Verify native packaging prerequisite
        run: gradle --no-daemon :app:verifyLibreOfficeArm64Core

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify LibreOffice library inside APK
        run: bash native-engine/scripts/check-apk-libreoffice.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: NiceExcel-LibreOffice-ARM64-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
