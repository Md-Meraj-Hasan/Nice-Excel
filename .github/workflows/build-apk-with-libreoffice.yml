
name: Build NiceExcel APK with LibreOffice ARM64

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: "Successful LibreOffice native-core workflow Run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download LibreOffice ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: libreoffice-arm64-native-core
          repository: ${{ github.repository }}
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/libreoffice-core

      - name: Download matching LibreOffice Android runtime assets
        uses: actions/download-artifact@v4
        with:
          name: libreoffice-arm64-runtime-assets
          repository: ${{ github.repository }}
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/libreoffice-runtime

      - name: Stage matching native libraries and runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-engine/jniLibs/arm64-v8a
          cp -v /tmp/libreoffice-core/*.so \
            native-engine/jniLibs/arm64-v8a/
          test -s native-engine/jniLibs/arm64-v8a/liblo-native-code.so
          count=$(find native-engine/jniLibs/arm64-v8a \
            -maxdepth 1 -name '*.so' | wc -l)
          echo "Native libraries found: $count"
          test "$count" -eq 14

          EXPECTED="6e0b39149b549bd05065d451006c4d060589891d"
          ACTUAL="$(cat /tmp/libreoffice-runtime/SOURCE-COMMIT.txt)"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "::error::Runtime assets revision $ACTUAL does not match Java bootstrap revision $EXPECTED."
            exit 1
          }

          mkdir -p app/src/main/assets app/src/main/res/raw
          cp -a /tmp/libreoffice-runtime/assets/. app/src/main/assets/
          cp -a /tmp/libreoffice-runtime/assets_strippedUI/. app/src/main/assets/
          cp -f /tmp/libreoffice-runtime/res_generated/raw/license.txt app/src/main/res/raw/lo_license.txt
          cp -f /tmp/libreoffice-runtime/res_generated/raw/notice.txt app/src/main/res/raw/lo_notice.txt
          sed -i 's#@@APPLICATION_ID@@#com.meraj.niceexcel#g' app/src/main/assets/unpack/etc/fonts/fonts.conf
          grep -q '/data/data/com.meraj.niceexcel/fontconfig' app/src/main/assets/unpack/etc/fonts/fonts.conf

      - name: Verify ARM64 architecture
        run: bash native-engine/scripts/check-arm64-core.sh

      - name: Verify native dependencies
        run: bash native-engine/scripts/check-native-dependency-closure.sh

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Verify native packaging prerequisite
        run: gradle --no-daemon :app:verifyLibreOfficeArm64Core

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify LibreOffice native library and runtime assets inside APK
        run: |
          bash native-engine/scripts/check-apk-libreoffice.sh app/build/outputs/apk/debug/app-debug.apk
          bash native-engine/scripts/check-apk-lo-runtime.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: NiceExcel-LibreOffice-ARM64-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
